services:
  mysql:
    image: mysql:8.4
    container_name: opspilot-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-opspilot}
      MYSQL_USER: ${DB_USERNAME:-opspilot}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before starting MySQL}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD before starting MySQL}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mysql_data:
