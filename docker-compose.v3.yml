name: opspilot-v3-local

services:
  mysql:
    image: mysql:8.4
    container_name: opspilot-v3-mysql
    environment:
      MYSQL_DATABASE: ${V3_DB_NAME:-opspilot}
      MYSQL_USER: ${V3_DB_USERNAME:-opspilot}
      MYSQL_PASSWORD: ${V3_DB_PASSWORD:?Set V3_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${V3_MYSQL_ROOT_PASSWORD:?Set V3_MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${V3_MYSQL_HOST_PORT:-3310}:3306"
    volumes:
      - opspilot_v3_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: opspilot-v3-redis
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${V3_REDIS_PASSWORD:?Set V3_REDIS_PASSWORD}
    volumes:
      - opspilot_v3_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.20.0
    container_name: opspilot-v3-qdrant
    expose:
      - "6333"
    volumes:
      - opspilot_v3_qdrant_data:/qdrant/storage
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.40.15
    container_name: opspilot-v3-ollama
    expose:
      - "11434"
    environment:
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: 30m
    volumes:
      - opspilot_v3_ollama_data:/root/.ollama
    restart: unless-stopped

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: opspilot-v3-ai-service
    environment:
      AI_INTERNAL_TOKEN: ${V3_AI_INTERNAL_TOKEN:?Set V3_AI_INTERNAL_TOKEN}
      AI_QDRANT_URL: http://qdrant:6333
      AI_QDRANT_COLLECTION: opspilot_knowledge
      AI_OLLAMA_BASE_URL: http://ollama:11434
      AI_OLLAMA_MODEL: qwen2.5:1.5b-instruct
      AI_EMBEDDING_MODEL: intfloat/multilingual-e5-small
      AI_EMBEDDING_REVISION: 614241f622f53c4eeff9890bdc4f31cfecc418b3
      AI_SEARCH_MIN_SCORE: ${V3_KNOWLEDGE_MIN_SCORE:-0.81}
      AI_MODEL_CACHE_DIR: /var/cache/huggingface
      AI_OLLAMA_TIMEOUT_SECONDS: 300
    expose:
      - "8000"
    volumes:
      - opspilot_v3_ai_model_cache:/var/cache/huggingface
    depends_on:
      qdrant:
        condition: service_started
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: opspilot-v3-backend
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${V3_DB_NAME:-opspilot}
      DB_USERNAME: ${V3_DB_USERNAME:-opspilot}
      DB_PASSWORD: ${V3_DB_PASSWORD:?Set V3_DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${V3_REDIS_PASSWORD:?Set V3_REDIS_PASSWORD}
      JWT_SECRET: ${V3_JWT_SECRET:?Set V3_JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${V3_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      AUTH_RATE_LIMIT_ENABLED: "true"
      AI_SERVICE_URL: http://ai-service:8000
      AI_INTERNAL_TOKEN: ${V3_AI_INTERNAL_TOKEN:?Set V3_AI_INTERNAL_TOKEN}
      AI_INDEX_WORKER_ENABLED: "true"
      MANAGEMENT_SERVER_ADDRESS: 0.0.0.0
      MANAGEMENT_SERVER_PORT: 8081
      METRICS_USERNAME: ${V3_METRICS_USERNAME:-metrics}
      METRICS_PASSWORD: ${V3_METRICS_PASSWORD:?Set V3_METRICS_PASSWORD}
    ports:
      - "127.0.0.1:${V3_BACKEND_HOST_PORT:-8084}:8080"
      - "127.0.0.1:${V3_MANAGEMENT_HOST_PORT:-8085}:8081"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s
    restart: unless-stopped
    stop_grace_period: 35s

volumes:
  opspilot_v3_mysql_data:
    name: opspilot_v3_mysql_data
  opspilot_v3_redis_data:
    name: opspilot_v3_redis_data
  opspilot_v3_qdrant_data:
    name: opspilot_v3_qdrant_data
  opspilot_v3_ollama_data:
    name: opspilot_v3_ollama_data
  opspilot_v3_ai_model_cache:
    name: opspilot_v3_ai_model_cache
