name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'docker-compose.v2.yml'
      - 'README.md'
      - 'PROJECT_ROADMAP.md'
      - 'TEAM_STATUS.md'
      - 'docs/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'docker-compose.v2.yml'
      - 'README.md'
      - 'PROJECT_ROADMAP.md'
      - 'TEAM_STATUS.md'
      - 'docs/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  verify:
    # Testcontainers 1.21 uses Docker API 1.32; ubuntu-latest moved to a daemon
    # requiring API 1.40, so keep this job on the compatible 24.04 runner.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify backend (unit + Testcontainers integration)
        run: mvn clean verify

      - name: Upload V3 HTTP boundary JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-http-boundary-junit-${{ github.run_id }}
          path: backend/target/failsafe-reports/TEST-com.opspilot.acceptance.V3KnowledgeHttpBoundaryIT.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Build Java 21 backend image
        working-directory: .
        run: docker build -f backend/Dockerfile -t opspilot-backend-ci:${{ github.sha }} backend

      - name: Confirm Java 21 runtime in image
        run: docker run --rm --entrypoint java opspilot-backend-ci:${{ github.sha }} -version
