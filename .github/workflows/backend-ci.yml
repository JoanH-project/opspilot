name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'docker-compose.v2.yml'
      - 'README.md'
      - 'PROJECT_ROADMAP.md'
      - 'TEAM_STATUS.md'
      - 'docs/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'docker-compose.v2.yml'
      - 'README.md'
      - 'PROJECT_ROADMAP.md'
      - 'TEAM_STATUS.md'
      - 'docs/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify backend (unit + Testcontainers integration)
        run: mvn clean verify

      - name: Build Java 21 backend image
        working-directory: .
        run: docker build -f backend/Dockerfile -t opspilot-backend-ci:${{ github.sha }} backend

      - name: Confirm Java 21 runtime in image
        run: docker run --rm --entrypoint java opspilot-backend-ci:${{ github.sha }} -version
