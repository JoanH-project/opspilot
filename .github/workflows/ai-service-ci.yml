name: AI Service CI

on:
  push:
    branches:
      - main
    paths:
      - 'ai-service/**'
      - 'docker-compose.v3.yml'
      - '.github/workflows/ai-service-ci.yml'
  pull_request:
    paths:
      - 'ai-service/**'
      - 'docker-compose.v3.yml'
      - '.github/workflows/ai-service-ci.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.20.0
        ports:
          - 6333:6333
        options: >-
          --health-cmd "bash -c '</dev/tcp/127.0.0.1/6333'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    defaults:
      run:
        working-directory: ai-service

    env:
      AI_INTERNAL_TOKEN: ci-only-internal-token-0123456789abcdef
      AI_TEST_QDRANT_URL: http://localhost:6333

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.7

      - name: Install locked dependencies
        run: uv sync --frozen --group dev --no-install-project

      - name: Lint
        run: uv run --no-sync ruff check app tests scripts

      - name: Test against Qdrant server
        run: uv run --no-sync pytest -p no:cacheprovider

      - name: Build AI service image
        working-directory: .
        run: docker build -f ai-service/Dockerfile -t opspilot-ai-service-ci:${{ github.sha }} ai-service
