spring:
  application:
    name: opspilot-backend
  profiles:
    default: local
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:opspilot}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:opspilot}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: 2000
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: 2
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 2s
      timeout: 2s
      lettuce:
        shutdown-timeout: 100ms
  lifecycle:
    timeout-per-shutdown-phase: 30s
  mvc:
    async:
      request-timeout: 30s

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    # Local-development fallback only. application-prod.yml requires JWT_SECRET.
    secret: ${JWT_SECRET:opspilot-development-only-jwt-secret-change-me-2026}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  auth:
    rate-limit:
      enabled: ${AUTH_RATE_LIMIT_ENABLED:false}
      ip:
        max-attempts: ${AUTH_RATE_LIMIT_IP_MAX_ATTEMPTS:60}
        window: ${AUTH_RATE_LIMIT_IP_WINDOW:60s}
      account:
        max-attempts: ${AUTH_RATE_LIMIT_ACCOUNT_MAX_ATTEMPTS:20}
        window: ${AUTH_RATE_LIMIT_ACCOUNT_WINDOW:10m}
      trusted-proxies: ${AUTH_RATE_LIMIT_TRUSTED_PROXIES:}
  metrics:
    username: ${METRICS_USERNAME:metrics}
    # Local-only fallback. Production requires a separately generated value.
    password: ${METRICS_PASSWORD:local-prometheus-change-me}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    connection-timeout: 5s

management:
  prometheus:
    metrics:
      export:
        enabled: true
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}
    address: ${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health,prometheus
      discovery:
        enabled: false
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
      probes:
        enabled: true
        add-additional-paths: true
      group:
        readiness:
          include: readinessState,db,authRateLimit
        authentication:
          include: authRateLimit
    prometheus:
      access: read-only
  health:
    redis:
      enabled: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{requestId:-}] %logger{36} - %msg%n"
