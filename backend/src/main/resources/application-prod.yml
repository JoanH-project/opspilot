spring:
  datasource:
    url: "jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?sslMode=${DB_SSL_MODE:VERIFY_IDENTITY}&serverTimezone=UTC&connectTimeout=${DB_CONNECT_TIMEOUT_MS:5000}&socketTimeout=${DB_SOCKET_TIMEOUT_MS:15000}"
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: 2000
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_COMMAND_TIMEOUT:2s}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  auth:
    rate-limit:
      enabled: true
      ip:
        max-attempts: ${AUTH_RATE_LIMIT_IP_MAX_ATTEMPTS:60}
        window: ${AUTH_RATE_LIMIT_IP_WINDOW:60s}
      account:
        max-attempts: ${AUTH_RATE_LIMIT_ACCOUNT_MAX_ATTEMPTS:20}
        window: ${AUTH_RATE_LIMIT_ACCOUNT_WINDOW:10m}
      trusted-proxies: ${AUTH_RATE_LIMIT_TRUSTED_PROXIES:}
  metrics:
    username: ${METRICS_USERNAME}
    password: ${METRICS_PASSWORD}

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}
    address: ${MANAGEMENT_SERVER_ADDRESS}
